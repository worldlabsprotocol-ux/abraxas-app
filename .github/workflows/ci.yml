# FILE: .github/workflows/ci.yml
# Runs on push to main and on pull requests only.
# NO scheduled triggers — avoids conflicts with Vercel auto-deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Homepage guard (protected UI surface)
        run: npm run check:homepage-guard
        env:
          UI_APPROVED: ${{ (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[ui-change]') || contains(github.event.pull_request.body, '[ui-change]'))) && 'true' || '' }}

      - name: Homepage invariant tests
        run: npm run check:homepage

      - name: Trust contract drift check (report-only)
        run: npm run check:trust-contract-drift

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Placeholders allow `next build` when repo secrets are unset; production uses Vercel env.
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-placeholder-secret' }}
          NEXT_PUBLIC_SOLANA_RPC: https://api.mainnet-beta.solana.com
          NEXT_PUBLIC_VERIFICATION_PROGRAM_ID: ABRAXASverify1111111111111111111111111111111

  audit-hash-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_072_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_072_parity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit hash SQL parity
        run: bash scripts/ci/run-audit-hash-sql-parity.sh
        env:
          AUDIT_HASH_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_072_parity
