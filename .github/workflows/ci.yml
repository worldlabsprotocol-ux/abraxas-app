# FILE: .github/workflows/ci.yml
# Runs on push to main and on pull requests only.
# NO scheduled triggers — avoids conflicts with Vercel auto-deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript-validation:
    name: typescript-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation (blocking)
        run: npm run validate:typescript

  eslint-validation:
    name: eslint-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Next.js build with in-process ESLint and type validation (blocking)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-placeholder-secret' }}
          NEXT_PUBLIC_SOLANA_RPC: https://api.mainnet-beta.solana.com
          NEXT_PUBLIC_VERIFICATION_PROGRAM_ID: ABRAXASverify1111111111111111111111111111111
      - name: Smoke test bundled Solana signer endpoint
        run: node scripts/ci/smoke-solana-signer-route.mjs

  build:
    needs:
      - typescript-validation
      - eslint-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Match package.json and the Vercel production runtime.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Solana operator CLI CommonJS smoke
        run: |
          set +e
          precheck=$(ABRAXAS_SOLANA_GATE_VERIFY_RPC_URL=invalid npx tsx scripts/solana-devnet-chain-precheck.ts 2>&1)
          precheck_code=$?
          postcheck=$(npx tsx scripts/solana-gate-config-postcheck.ts 2>&1)
          postcheck_code=$?
          initializer=$(npx tsx scripts/solana-gate-config-initialize-local.ts 2>&1)
          initializer_code=$?
          set -e
          test "$precheck_code" -eq 1
          echo "$precheck" | grep -q '"reason":"rpc_unavailable"'
          test "$postcheck_code" -eq 2
          echo "$postcheck" | grep -q 'usage: npx tsx scripts/solana-gate-config-postcheck.ts'
          test "$initializer_code" -eq 2
          echo "$initializer" | grep -q 'usage: npx tsx scripts/solana-gate-config-initialize-local.ts'

      - name: Homepage guard (protected UI surface)
        run: npm run check:homepage-guard
        env:
          UI_APPROVED: ${{ (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[ui-change]') || contains(github.event.pull_request.body, '[ui-change]'))) && 'true' || '' }}

      - name: Homepage invariant tests
        run: npm run check:homepage

      - name: Sandbox result continuity tests
        run: npx vitest run components/developers/IntegrationStudioRequestWorkbench.test.tsx components/developers/IntegrationStudioBeginnerFlow.test.tsx lib/partner/launchpad/formatHarnessResultForBuilder.test.ts

      - name: Build #865 evidence continuity + #868 portable relying party (contract)
        run: npm run test:build-865-evidence-continuity && npm run test:build-868-portable-relying-party

      - name: Trust contract drift check (report-only)
        run: npm run check:trust-contract-drift

      - name: Execution contract guard (blocking)
        run: npm run check:execution-contracts

      - name: Onchain gate deployment and Solana observation tests
        run: npx vitest run lib/partner/onchainGateDeployments/onchainGateDeployments.test.ts lib/partner/onchainGateDeployments/gateRegistrationKeccak.test.ts lib/partner/onchainGateDeployments/solanaObserve.test.ts lib/partner/testnetGateDeploymentKit/testnetGateDeploymentKit.test.ts lib/partner/testnetGateDeploymentKit/solanaConfigPreflight.test.ts lib/partner/testnetGateDeploymentKit/solanaConfigInitialize.test.ts lib/partner/testnetGateDeploymentKit/solanaDevnetChainPrecheck.test.ts lib/partner/testnetGateDeploymentKit/solanaDevnetCurrentDeployment.test.ts lib/partner/testnetGateDeploymentKit/solanaGateConfigPostcheck.test.ts lib/partner/testnetGateDeploymentKit/solanaGateConfigLocalInitialize.test.ts lib/partner/testnetGateDeploymentKit/solanaProtocolAccessLocalInitialize.test.ts

      - name: DEMO Solana signer provisioning contract
        run: npx vitest run lib/partner/chainAttestationSignerLifecycle/demoSolanaProvision.test.ts lib/partner/chainAttestation/utf8.test.ts

      - name: Vercel-parity compile (lint/type validated in eslint-validation job)
        run: npm run build:compile
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-placeholder-secret' }}
          NEXT_PUBLIC_SOLANA_RPC: https://api.mainnet-beta.solana.com
          NEXT_PUBLIC_VERIFICATION_PROGRAM_ID: ABRAXASverify1111111111111111111111111111111

  audit-hash-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_072_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_072_parity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit hash SQL parity
        run: bash scripts/ci/run-audit-hash-sql-parity.sh
        env:
          AUDIT_HASH_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_072_parity

  migration-076-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_076_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_076_parity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration 076 SQL parity
        run: bash scripts/ci/run-migration-076-sql-parity.sh
        env:
          MIGRATION_076_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_076_parity

  migration-081-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_081_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_081_parity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration 081 SQL parity
        run: bash scripts/ci/run-migration-081-sql-parity.sh
        env:
          MIGRATION_081_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_081_parity

  migration-153-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_153_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_153_parity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration 153 SQL parity
        run: bash scripts/ci/run-migration-153-sql-parity.sh
        env:
          MIGRATION_153_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_153_parity

      - name: Evidence migration chain parity (059→093→113→151→153)
        run: bash scripts/ci/run-migration-evidence-chain-parity.sh
        env:
          MIGRATION_EVIDENCE_CHAIN_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_evidence_chain

      - name: Demo drift reconciliation parity (093 without 059)
        run: bash scripts/ci/run-demo-drift-reconciliation-parity.sh
        env:
          DEMO_DRIFT_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/demo_drift_reconciliation

      - name: Trust slice backup restore parity
        run: bash scripts/ci/run-trust-slice-backup-restore-parity.sh
        env:
          TRUST_SLICE_BACKUP_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_evidence_chain
          POSTGRES_CLIENT_DOCKER_IMAGE: postgres:16-alpine
          PARITY_REPO_ROOT: ${{ github.workspace }}

      - name: Decision receipt backup restore parity
        run: bash scripts/ci/run-decision-receipt-backup-restore-parity.sh
        env:
          RECEIPT_BACKUP_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_153_parity
          POSTGRES_CLIENT_DOCKER_IMAGE: postgres:16-alpine
          PARITY_REPO_ROOT: ${{ github.workspace }}

  foundry-evm-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: EVM eligibility verifier tests
        working-directory: contracts/evm-eligibility-verifier
        run: forge test -vv

  solana-eligibility-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - name: Solana eligibility gate ProgramTest
        working-directory: solana/abraxas-eligibility-gate
        run: cargo test --workspace -- --nocapture

  solana-v2-release-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - name: Install Solana CLI 2.2.20
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.2.20/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install JavaScript dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - name: Rebuild the reviewed ELF with pinned SBF tools
        working-directory: solana/abraxas-eligibility-gate
        run: |
          PATH="$HOME/.cache/solana/v1.53/platform-tools/rust/bin:$PATH" \
            cargo-build-sbf --tools-version v1.53 --no-rustup-override \
            --manifest-path programs/abraxas-eligibility-gate/Cargo.toml
      - name: Compare both ELF digests with the reviewed release
        run: npx tsx scripts/solana-v2-gate-release-digest.ts
      - name: Build protocol-access candidate with pinned SBF tools
        working-directory: solana/abraxas-eligibility-gate
        run: |
          PATH="$HOME/.cache/solana/v1.53/platform-tools/rust/bin:$PATH" \
            cargo-build-sbf --tools-version v1.53 --no-rustup-override \
            --manifest-path programs/abraxas-protocol-access/Cargo.toml
      - name: Print secret-free protocol-access candidate digest
        run: npx tsx scripts/solana-protocol-access-candidate-digest.ts

  sovereign-native-account-pg:
    name: sovereign-native-account-pg
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abraxas_sovereign
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abraxas_sovereign"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply sovereign native account migrations
        run: node scripts/sovereign/apply-native-account-migrations.mjs
        env:
          ABRAXAS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/abraxas_sovereign
      - name: Sovereign native account integration (no Supabase credentials)
        run: |
          npx vitest run --no-file-parallelism \
            lib/auth/nativeAccount/sovereignNativeAccount.integration.test.ts \
            lib/partner/launchpad/sovereignLaunchpad.integration.test.ts \
            lib/partner/launchpad/sovereignLaunchpad.http.integration.test.ts
        env:
          ABRAXAS_SOVEREIGN_INTEGRATION_TEST: "1"
          ABRAXAS_SOVEREIGN_SANDBOX_INTEGRATION: "1"
          ABRAXAS_SOVEREIGN_NATIVE_ACCOUNT: "1"
          ABRAXAS_PERSISTENCE_BACKEND: postgres_direct
          ABRAXAS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/abraxas_sovereign
          ABRAXAS_NATIVE_ACCOUNT_MEMORY: "0"
          ABRAXAS_NATIVE_ACCOUNT_AUTH_ENABLED: "1"
          ABRAXAS_ACCOUNT_SESSION_SECRET: ci-sovereign-integration-session-secret-32
          ABRAXAS_BROWSER_SESSION_SECRET: ci-sovereign-browser-session-secret-32

  sovereign-operational-proof:
    name: sovereign-operational-proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Independent verifier (Build #818, no app backend)
        run: npx vitest run packages/abraxas-independent-verifier/src/independentVerifier.adversarial.test.ts packages/abraxas-independent-verifier/src/signedStatus.adversarial.test.ts lib/persistence/boundary/independentVerifierHarness.test.ts examples/integration-first-relying-party/integration-first.test.ts lib/partner/portableIndependentVerification/partnerFlowPortableVerification.test.ts
      - name: Sovereign slice operational proof (no Supabase)
        run: npx vitest run --no-file-parallelism lib/persistence/boundary/sovereignOperationalProof.integration.test.ts
        env:
          ABRAXAS_SOVEREIGN_OPERATIONAL_PROOF: "1"
          ABRAXAS_PERSISTENCE_BACKEND: postgres_direct
          NEXT_PUBLIC_SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
      - name: Build #820 three-layer trust acceptance (CI contract)
        run: npx vitest run --no-file-parallelism lib/persistence/boundary/staging/threeLayerTrustAcceptance.integration.test.ts
        env:
          ABRAXAS_SOVEREIGN_OPERATIONAL_PROOF: "1"
          ABRAXAS_BUILD_820_CI_CONTRACT: "1"
          ABRAXAS_PERSISTENCE_BACKEND: postgres_direct
          NEXT_PUBLIC_SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
      - name: Build #834 sovereign current-validity parity (CI contract)
        run: npx vitest run --no-file-parallelism lib/persistence/boundary/staging/build834SovereignValidityParity.integration.test.ts lib/decisionReceipts/currentValidity/decisionCore.test.ts
        env:
          ABRAXAS_SOVEREIGN_OPERATIONAL_PROOF: "1"
          ABRAXAS_BUILD_820_CI_CONTRACT: "1"
          ABRAXAS_BUILD_834_CI_CONTRACT: "1"
          ABRAXAS_PERSISTENCE_BACKEND: postgres_direct
          ABRAXAS_SOVEREIGN_STAGING_RESTORE_DRILL_AUTHORIZED: "true"
          ABRAXAS_SOVEREIGN_STAGING_RESTORE_OPERATOR_AUTHORIZATION: build834-ci
          ABRAXAS_SOVEREIGN_STAGING_RESTORE_OPERATOR_AUTHORIZATION_EXPECTED: build834-ci
          ABRAXAS_BACKUP_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
          NEXT_PUBLIC_SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
      - name: Build #835 sovereign authority resilience
        run: npm run sovereign:build-835-authority-resilience
        env:
          ABRAXAS_SOVEREIGN_OPERATIONAL_PROOF: "1"
          ABRAXAS_BUILD_835_CI_CONTRACT: "1"
          ABRAXAS_PERSISTENCE_BACKEND: postgres_direct
          NEXT_PUBLIC_SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
      - name: Build #836 sovereign application authorization parity
        run: npm run sovereign:build-836-application-authorization-parity
        env:
          ABRAXAS_SOVEREIGN_OPERATIONAL_PROOF: "1"
          ABRAXAS_BUILD_836_CI_CONTRACT: "1"
          ABRAXAS_PERSISTENCE_BACKEND: postgres_direct
          ABRAXAS_SOVEREIGN_ENV_CLASS: disposable
          ABRAXAS_SOVEREIGN_STAGING_FIXTURE_WRITES: "true"
          ABRAXAS_DISPOSABLE_PG_MIGRATION_AUTHORIZED: "true"
          ABRAXAS_BACKUP_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
          NEXT_PUBLIC_SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
      - name: Build #837 sovereign evidence integrity
        run: npm run sovereign:build-837-evidence-integrity
        env:
          ABRAXAS_SOVEREIGN_OPERATIONAL_PROOF: "1"
          ABRAXAS_BUILD_837_CI_CONTRACT: "1"
          ABRAXAS_PERSISTENCE_BACKEND: postgres_direct
          ABRAXAS_SOVEREIGN_ENV_CLASS: disposable
          ABRAXAS_SOVEREIGN_STAGING_FIXTURE_WRITES: "true"
          ABRAXAS_DISPOSABLE_PG_MIGRATION_AUTHORIZED: "true"
          NEXT_PUBLIC_SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""

  ephemeral-wallet-auth:
    name: ephemeral-wallet-auth
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ephemeral wallet auth (no PostgreSQL account store)
        run: npx vitest run lib/auth/ephemeralWallet/
        env:
          ABRAXAS_EPHEMERAL_WALLET_AUTH: "1"
          ABRAXAS_EPHEMERAL_INTEGRATION_TEST: "1"
          ABRAXAS_ACCOUNT_SESSION_SECRET: ci-ephemeral-wallet-session-secret-32
          NEXT_PUBLIC_SOLANA_NETWORK: devnet
      - name: Passport Solana wallet lifecycle
        run: npx vitest run app/api/auth/browser-session/route.test.ts components/passport/PassportSolanaWalletConnection.test.tsx components/passport/PassportSolanaSessionBoundary.test.tsx components/passport/PassportSolanaSessionRestoration.test.tsx components/passport/PassportSolanaSignInButton.lifecycle.test.tsx lib/wallet/passportSolanaAuthClient.test.ts lib/wallet/passportSolanaAuthClient.isolation.test.ts
      - name: Passport Solana holder ownership
        run: npx vitest run lib/passport/portableTrust/solanaHolderSession.test.ts lib/passport/portableTrust/portableTrust.security.test.ts lib/verification/requestPreviewAccess.test.ts app/api/passport/requests/route.test.ts app/api/passport/verification-activity/route.test.ts app/api/passport/verification-activity/withdraw/route.test.ts app/api/passport/verification-activity/withdraw-all/route.test.ts lib/privacy/privacyRoutes.test.ts
      - name: Ephemeral wallet auth (TCP Redis replay)
        run: npx vitest run lib/auth/ephemeralWallet/ephemeralWallet.redis.integration.test.ts
        env:
          ABRAXAS_EPHEMERAL_WALLET_AUTH: "1"
          ABRAXAS_ACCOUNT_SESSION_SECRET: ci-ephemeral-wallet-session-secret-32
          NEXT_PUBLIC_SOLANA_NETWORK: devnet
          ABRAXAS_EPHEMERAL_REDIS_URL: redis://127.0.0.1:6379




