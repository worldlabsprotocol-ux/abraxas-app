# FILE: .github/workflows/ci.yml
# Runs on push to main and on pull requests only.
# NO scheduled triggers — avoids conflicts with Vercel auto-deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Homepage guard (protected UI surface)
        run: npm run check:homepage-guard
        env:
          UI_APPROVED: ${{ (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[ui-change]') || contains(github.event.pull_request.body, '[ui-change]'))) && 'true' || '' }}

      - name: Homepage invariant tests
        run: npm run check:homepage

      - name: Trust contract drift check (report-only)
        run: npm run check:trust-contract-drift

      - name: Onchain gate deployment and Solana observation tests
        run: npx vitest run lib/partner/onchainGateDeployments/onchainGateDeployments.test.ts lib/partner/onchainGateDeployments/solanaObserve.test.ts lib/partner/testnetGateDeploymentKit/testnetGateDeploymentKit.test.ts lib/partner/testnetGateDeploymentKit/solanaConfigPreflight.test.ts lib/partner/testnetGateDeploymentKit/solanaConfigInitialize.test.ts lib/partner/testnetGateDeploymentKit/solanaDevnetChainPrecheck.test.ts lib/partner/testnetGateDeploymentKit/solanaGateConfigPostcheck.test.ts lib/partner/testnetGateDeploymentKit/solanaGateConfigLocalInitialize.test.ts

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Placeholders allow `next build` when repo secrets are unset; production uses Vercel env.
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-placeholder-secret' }}
          NEXT_PUBLIC_SOLANA_RPC: https://api.mainnet-beta.solana.com
          NEXT_PUBLIC_VERIFICATION_PROGRAM_ID: ABRAXASverify1111111111111111111111111111111

  audit-hash-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_072_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_072_parity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit hash SQL parity
        run: bash scripts/ci/run-audit-hash-sql-parity.sh
        env:
          AUDIT_HASH_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_072_parity

  migration-076-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_076_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_076_parity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration 076 SQL parity
        run: bash scripts/ci/run-migration-076-sql-parity.sh
        env:
          MIGRATION_076_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_076_parity

  migration-081-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_081_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_081_parity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration 081 SQL parity
        run: bash scripts/ci/run-migration-081-sql-parity.sh
        env:
          MIGRATION_081_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_081_parity

  foundry-evm-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: EVM eligibility verifier tests
        working-directory: contracts/evm-eligibility-verifier
        run: forge test -vv

  solana-eligibility-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - name: Solana eligibility gate ProgramTest
        working-directory: solana/abraxas-eligibility-gate
        run: cargo test --workspace -- --nocapture

  solana-v2-release-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - name: Install Solana CLI 2.2.20
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.2.20/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install JavaScript dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - name: Rebuild the reviewed ELF with pinned SBF tools
        working-directory: solana/abraxas-eligibility-gate
        run: |
          PATH="$HOME/.cache/solana/v1.53/platform-tools/rust/bin:$PATH" \
            cargo-build-sbf --tools-version v1.53 --no-rustup-override \
            --manifest-path programs/abraxas-eligibility-gate/Cargo.toml
      - name: Compare both ELF digests with the reviewed release
        run: npx tsx scripts/solana-v2-gate-release-digest.ts
      - name: Build protocol-access candidate with pinned SBF tools
        working-directory: solana/abraxas-eligibility-gate
        run: |
          PATH="$HOME/.cache/solana/v1.53/platform-tools/rust/bin:$PATH" \
            cargo-build-sbf --tools-version v1.53 --no-rustup-override \
            --manifest-path programs/abraxas-protocol-access/Cargo.toml
      - name: Print secret-free protocol-access candidate digest
        run: npx tsx scripts/solana-protocol-access-candidate-digest.ts

