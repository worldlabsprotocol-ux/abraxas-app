[package]
name = "abraxas-trust-registry"
version = "0.1.0"
description = "Governed Solana trust registry for receipt commitments and revocations (Build #533). Local/reference."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "abraxas_trust_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
