[package]
name = "abraxas-eligibility-consumer"
version = "0.1.0"
description = "Reference consumer. Records a test authorization result only. No transfers."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "abraxas_eligibility_consumer"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
abraxas-eligibility-gate = { path = "../abraxas-eligibility-gate", features = ["cpi"] }
