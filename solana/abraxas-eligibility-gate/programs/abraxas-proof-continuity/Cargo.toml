[package]
name = "abraxas-proof-continuity"
version = "0.1.0"
description = "Receipt payload commitment and status continuity on Solana. Local/reference only. No private evidence on-chain."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "abraxas_proof_continuity"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
spl-token-2022 = { version = "=3.0.5", features = ["no-entrypoint"] }
abraxas-eligibility-gate = { path = "../abraxas-eligibility-gate", features = ["no-entrypoint"] }