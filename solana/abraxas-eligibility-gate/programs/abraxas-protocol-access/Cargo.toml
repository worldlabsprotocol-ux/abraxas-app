[package]
name = "abraxas-protocol-access"
version = "0.1.0"
description = "Partner-owned protocol access consumer. Local/reference only. No funds movement."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "abraxas_protocol_access"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
abraxas-eligibility-gate = { path = "../abraxas-eligibility-gate", features = ["cpi"] }
