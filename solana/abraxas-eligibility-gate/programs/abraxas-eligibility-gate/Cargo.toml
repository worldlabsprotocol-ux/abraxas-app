[package]
name = "abraxas-eligibility-gate"
version = "0.1.0"
description = "Partner-owned Solana eligibility gate. Local/reference only. No funds movement."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "abraxas_eligibility_gate"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
