# Reproducible local sovereign staging (primary + restore Postgres).
# Not a Production deployment — use for contract validation and operator drills.

services:
  sovereign-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abraxas
      POSTGRES_PASSWORD: abraxas_staging_local
      POSTGRES_DB: abraxas_sovereign_staging
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abraxas -d abraxas_sovereign_staging"]
      interval: 5s
      timeout: 5s
      retries: 10

  sovereign-restore:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abraxas
      POSTGRES_PASSWORD: abraxas_staging_local
      POSTGRES_DB: abraxas_sovereign_staging_restore
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abraxas -d abraxas_sovereign_staging_restore"]
      interval: 5s
      timeout: 5s
      retries: 10
