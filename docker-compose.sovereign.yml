# Minimal reproducible Abraxas sovereign PostgreSQL (local/staging).
# Production: use managed PostgreSQL with TLS; mount encrypted evidence separately.
services:
  abraxas-sovereign-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abraxas
      POSTGRES_PASSWORD: ${SOVEREIGN_POSTGRES_PASSWORD:-change-me-sovereign}
      POSTGRES_DB: abraxas_sovereign
    ports:
      - "${SOVEREIGN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - abraxas_sovereign_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abraxas -d abraxas_sovereign"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  abraxas_sovereign_pg_data:
