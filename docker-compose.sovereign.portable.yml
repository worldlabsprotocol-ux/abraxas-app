# Build #561 — portable Abraxas sovereign runtime (Postgres + Next.js API + persistent volumes).
#
#   export SOVEREIGN_PORTABLE_POSTGRES_PASSWORD='…'
#   export SOVEREIGN_PORTABLE_RESTORE_POSTGRES_PASSWORD='…'
#   bash scripts/sovereign-runtime/init-portable-data-dirs.sh
#   docker compose -f docker-compose.sovereign.portable.yml up -d --build
#
# Provide secrets via `.env.sovereign.portable` (gitignored); see `.env.sovereign.portable.example`.

services:
  abraxas-portable-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abraxas
      POSTGRES_PASSWORD: ${SOVEREIGN_PORTABLE_POSTGRES_PASSWORD:?Set SOVEREIGN_PORTABLE_POSTGRES_PASSWORD}
      POSTGRES_DB: abraxas_sovereign
    ports:
      - "127.0.0.1:${SOVEREIGN_PORTABLE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - abraxas_portable_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abraxas -d abraxas_sovereign"]
      interval: 5s
      timeout: 5s
      retries: 10

  abraxas-portable-postgres-restore:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abraxas
      POSTGRES_PASSWORD: ${SOVEREIGN_PORTABLE_RESTORE_POSTGRES_PASSWORD:?Set SOVEREIGN_PORTABLE_RESTORE_POSTGRES_PASSWORD}
      POSTGRES_DB: abraxas_sovereign_restore
    ports:
      - "127.0.0.1:${SOVEREIGN_PORTABLE_RESTORE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - abraxas_portable_restore_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abraxas -d abraxas_sovereign_restore"]
      interval: 5s
      timeout: 5s
      retries: 10

  abraxas-portable-api:
    build:
      context: .
      dockerfile: Dockerfile.sovereign.portable
    restart: unless-stopped
    depends_on:
      abraxas-portable-postgres:
        condition: service_healthy
    env_file:
      - .env.sovereign.portable
    environment:
      ABRAXAS_PERSISTENCE_BACKEND: postgres_direct
      ABRAXAS_DATABASE_URL: postgresql://abraxas:${SOVEREIGN_PORTABLE_POSTGRES_PASSWORD}@abraxas-portable-postgres:5432/abraxas_sovereign
      ABRAXAS_EVIDENCE_STORAGE_ROOT: /var/abraxas/evidence
      ABRAXAS_BACKUP_OUTPUT_DIR: /var/abraxas/backups
      ABRAXAS_SOVEREIGN_MIGRATION_AUTHORIZED: ${ABRAXAS_SOVEREIGN_MIGRATION_AUTHORIZED:-false}
    ports:
      - "127.0.0.1:${SOVEREIGN_PORTABLE_HTTP_PORT:-3000}:3000"
    volumes:
      - ${SOVEREIGN_EVIDENCE_HOST_PATH:-./data/evidence}:/var/abraxas/evidence
      - ${SOVEREIGN_BACKUP_HOST_PATH:-./data/backups}:/var/abraxas/backups

volumes:
  abraxas_portable_pg_data:
  abraxas_portable_restore_pg_data:
