# FILE: abraxas-program/Anchor.toml
# CLEAN VERSION — no backslash, correct cluster value
# After pasting this file, run: anchor keys list
# Then replace the placeholder program ID in BOTH:
#   1. This file  (verification = "YOUR_KEY")
#   2. programs/verification/src/lib.rs  (declare_id!("YOUR_KEY"))

[features]
seeds = false
skip-lint = false

[programs.mainnet]
verification = "ABRAXASverify1111111111111111111111111111111"
abraxas_passport = "Passport1111111111111111111111111111111111"

[programs.devnet]
verification = "ABRAXASverify1111111111111111111111111111111"
abraxas_passport = "Passport1111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "mainnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"